name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality checks
    runs-on: ubuntu-latest
    env:
      PGRUSTADMIN_TEST_DATABASE_URL: postgres://pgrustadmin:pgrustadmin_test@127.0.0.1:5432/pgrustadmin_test
      PGRUSTADMIN_CREDENTIAL_KEY: KioqKioqKioqKioqKioqKioqKioqKioqKioqKioqKio=
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pgrustadmin_test
          POSTGRES_USER: pgrustadmin
          POSTGRES_PASSWORD: pgrustadmin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pgrustadmin -d pgrustadmin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install stable Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
