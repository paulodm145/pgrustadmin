[workspace]
members = [
    "apps/server",
    "apps/tui",
    "crates/api-client",
    "crates/app-core",
    "crates/postgres-driver",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
pgrustadmin-postgres-driver = { path = "crates/postgres-driver" }
pgrustadmin-app-core = { path = "crates/app-core" }
pgrustadmin-api-client = { path = "crates/api-client" }
argon2 = "0.6"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
percent-encoding = "2"
rpassword = "7"
serde_json = "1"
base64 = "0.22"
chacha20poly1305 = { version = "0.11", features = ["getrandom", "zeroize"] }
zeroize = "1"
tower = { version = "0.5.2", default-features = false, features = ["util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# Colored underlines for the data grid lines; enabling it through `ratatui`
# would also lock its termina and termwiz backends.
ratatui-crossterm = { version = "0.1.2", default-features = false, features = ["underline-color"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures-util = "0.3"
